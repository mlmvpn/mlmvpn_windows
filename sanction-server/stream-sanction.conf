# Sanction-buster SNI proxy — top-level stream context.
# Included from nginx.conf main context. Listens on TCP/443 ONLY (AmneziaWG is UDP/443, untouched).
stream {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # $sanction_allowed = 1 for allowlisted sanctioned domains, else 0.
    include /etc/nginx/sanction-allowlist.map;

    # Allowed -> forward transparently to the real host. Denied -> local discard port (fast close).
    map $sanction_allowed $sanction_upstream {
        "1"     $ssl_preread_server_name:443;
        default 127.0.0.1:9;
    }

    # Per-client concurrent connection cap (anti-abuse).
    limit_conn_zone $binary_remote_addr zone=sanctconn:10m;

    log_format sanction '$remote_addr [$time_local] sni=$ssl_preread_server_name allowed=$sanction_allowed bytes=$bytes_sent';
    access_log /var/log/nginx/sanction.log sanction;

    server {
        listen 443 reuseport;
        ssl_preread on;
        limit_conn sanctconn 20;
        proxy_connect_timeout 5s;
        proxy_timeout 120s;
        proxy_pass $sanction_upstream;
    }
}
